<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万界武库 · 测试宿主</title><link rel="stylesheet" href="../style.css"><style>body{margin:0;background:#080f18;color:#94a4b6;font-family:system-ui,sans-serif}main.demo{max-width:850px;margin:50px auto;padding:25px}.demo h1{font-size:24px;color:#d4dee8}.demo .bubble{border:1px solid #1d2c3c;background:#101b29;border-radius:13px;padding:22px;margin:22px 0;font-size:15px;line-height:1.9}.demo small{color:#7c91a5}.demo button{padding:10px 15px;background:#1b3140;color:#b6d9db;border:1px solid #45616e;border-radius:7px}.demo p{line-height:1.8}#demo-message-receipts details{padding:16px;border:1px solid #36515c;border-radius:10px;margin:12px 0}#demo-message-receipts wjwk-field{display:block;padding:6px 0;overflow-wrap:anywhere}#demo-message-receipts wjwk-section{display:block;font-weight:bold;color:#e9ca8d}</style></head><body><main class="demo"><small>本地测试宿主 · 示例数据，不是酒馆会话</small><h1>世界树下，新的旅程</h1><div class="bubble" id="demo-story">夜色漫过枝叶，远处的城门刚刚亮起灯。<br>你停在道路交汇处，准备决定下一步行动。</div><p>右下角的“武库”按钮加载真实扩展代码。此页只模拟酒馆接口，模型调用返回固定测试数据，不连接外部模型。</p><label for="send_textarea">未发送正文草稿</label><textarea id="send_textarea" rows="4" style="width:100%;box-sizing:border-box;background:#101b29;color:#d4dee8;border:1px solid #45616e;padding:12px" placeholder="这里的草稿不会发送给任何真实模型"></textarea><div id="demo-message-receipts"></div><button id="demo-archive-change">加入母巢经营变化</button><button id="demo-workflow-turn">添加周期与模拟候选正文</button><button id="demo-workflow-receipt">添加条件成立与到账正文</button><button id="demo-management-turn">添加管理示例正文（不发奖）</button><button id="demo-narrative">模拟主叙事请求</button><p id="demo-prompt-state"></p><p><button id="demo-next-turn">继续一轮剧情（源质 +2）</button> <button id="demo-continue">同楼层继续生成（源质 +2）</button></p><p>先接入角色并执行插件方案，再继续剧情；武库应自动读取新余额，不要求处理历史接续。这里的奖励是固定演示数据。</p><h2>自编角色状态 · 演示 MVU</h2><p>接入并执行后，可观察余额和功法变化；这里展示测试宿主变量，不是社区作者的角色卡。</p><pre id="demo-role-state" style="white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #36515c;padding:18px;border-radius:12px"></pre></main><script type="module" src="./mock-host.js"></script><script type="module">import './mock-host.js';const c=SillyTavern.getContext();window.chatContextBefore={chatId:c.chatId,characterId:c.characterId,chat:c.chat,chatMetadata:c.chatMetadata};c.chatId=null;c.characterId=undefined;c.chat=[];c.chatMetadata={};await import('../index.js');</script></body></html>
